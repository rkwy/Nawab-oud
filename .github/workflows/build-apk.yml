name: Build Nawab Oud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Nawab Oud project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-project
          mkdir -p build-project

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-project

      - name: Find Gradle project root
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$(find build-project -type f             \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \)             -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts."
            echo "Extracted files:"
            find build-project -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "Gradle project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          echo "Building from: $(pwd)"
          gradle assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawab-Oud-Luxury-APK
          path: build-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
