name: Build Nawab Oud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            rm -rf build-project
            mkdir -p build-project
            ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then echo "ERROR: no Android project found"; exit 1; fi
            unzip -q "$ZIP_FILE" -d build-project
            PROJECT_DIR="$(find build-project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
          fi
          if [ -z "$PROJECT_DIR" ]; then echo "ERROR: no Gradle project root"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building from $PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawab-Oud-Liquid-Glass-120FPS-APK
          path: "${PROJECT_DIR}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 30
