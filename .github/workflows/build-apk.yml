name: Build Nawab Oud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Nawab Oud project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-project
          mkdir -p build-project

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-project

      - name: Find project directory
        shell: bash
        run: |
          echo "Project contents:"
          find build-project -maxdepth 3 -type f | head -100

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: build-project
        shell: bash
        run: |
          gradle assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawab-Oud-Luxury-APK
          path: build-project/**/build/outputs/apk/debug/*.apk
          retention-days: 30
