name: Build Nawab Oud APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract Nawab Oud project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-project
          mkdir -p build-project
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-project

      - name: Patch smooth UI, background and 58mm printer
        shell: bash
        run: |
          set -uo pipefail
          INDEX="$(find build-project -type f -path '*/app/src/main/assets/index.html' -print -quit)"
          JAVA="$(find build-project -type f \( -name 'MainActivity.java' -o -name 'MainActivity.kt' \) -print -quit || true)"
          ASSETS="$(dirname "$INDEX")"
          echo "INDEX=$INDEX"
          echo "JAVA=$JAVA"
          if [[ -z "$INDEX" ]]; then echo "::warning::index.html not found; UI patch skipped."; fi
          if [[ -z "$JAVA" ]]; then echo "::warning::MainActivity.java/.kt not found; native patch skipped."; fi

          if [[ -n "$INDEX" ]]; then
            python3 - "$INDEX" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")
          s = s.replace("filter:blur(13px)!important;opacity:var(--bg-frost)!important;", "filter:none!important;opacity:1!important;")
          s = s.replace("backdrop-filter:blur(var(--glass-blur))!important;", "backdrop-filter:none!important;")
          s = s.replace("-webkit-backdrop-filter:blur(var(--glass-blur))!important;", "-webkit-backdrop-filter:none!important;")

          patch = r'''
          <style id="NAWAB_SMOOTH_REFERENCE_FINAL">
          :root{--glass-opacity:.58;--card-opacity:.58;--action-opacity:.48;--glass-tint:250,245,238}
          html,body{min-height:100%;overflow-x:hidden!important;scroll-behavior:auto!important;overscroll-behavior-y:none!important;-webkit-overflow-scrolling:touch}
          body{position:relative!important;background:#d7c3a8!important;background-image:none!important;background-attachment:scroll!important;color:#201812!important}
          body::before{content:""!important;position:fixed!important;inset:-20px!important;z-index:-10!important;pointer-events:none!important;background:radial-gradient(circle at 50% 0%,rgba(255,248,235,.96),rgba(215,195,168,.92) 55%,rgba(102,72,42,.72))!important;filter:blur(clamp(0px,var(--glass-blur,8px),14px))!important;transform:translate3d(0,0,0) scale(1.03)!important;will-change:auto!important}
          body::after{content:""!important;position:fixed!important;inset:0!important;z-index:-9!important;pointer-events:none!important;background:linear-gradient(180deg,rgba(255,247,233,.10),rgba(66,42,22,.14))!important;filter:none!important}
          #app,#pro{position:relative!important;z-index:1!important}
          #pro{padding-bottom:132px!important}
          .wrap{max-width:760px!important;padding:10px 14px 30px!important;margin:0 auto!important}
          .brand{padding:22px 6px 18px!important;text-align:center!important}
          .brand h1{font-family:Georgia,"Times New Roman",serif!important;font-size:36px!important;line-height:1.05!important;letter-spacing:.11em!important;color:#110d0a!important}
          .brand p{font-family:Georgia,"Times New Roman",serif!important;font-size:15px!important;color:#8d6638!important;letter-spacing:.055em!important;margin:7px 0 0!important}
          .brand:after{content:"✦  PREMIUM FRAGRANCE BILLING  ✦"!important;display:block!important;color:#916b3a!important;font:700 10px/1.2 system-ui,sans-serif!important;letter-spacing:.22em!important;margin-top:15px!important}
          .card{background:rgba(var(--glass-tint),var(--card-opacity))!important;border:1px solid rgba(255,255,255,.62)!important;border-radius:28px!important;box-shadow:0 14px 34px rgba(58,38,20,.15),inset 0 1px 0 rgba(255,255,255,.78)!important;contain:layout paint style!important;overflow:hidden!important}
          select,input,textarea{background:rgba(255,255,255,.60)!important;border:1px solid rgba(255,255,255,.62)!important;border-radius:22px!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)!important}
          #pro>.nav{position:fixed!important;left:50%!important;right:auto!important;top:auto!important;bottom:calc(10px + env(safe-area-inset-bottom))!important;transform:translate3d(-50%,0,0)!important;width:calc(100% - 22px)!important;max-width:620px!important;height:82px!important;margin:0!important;padding:8px!important;display:grid!important;grid-template-columns:repeat(5,1fr)!important;gap:8px!important;overflow:visible!important;z-index:9999!important;border-radius:31px!important;background:rgba(var(--glass-tint),var(--glass-opacity))!important;border:1px solid rgba(255,255,255,.66)!important;box-shadow:0 18px 42px rgba(48,30,15,.20),inset 0 1px 0 rgba(255,255,255,.80),inset 0 -1px 0 rgba(98,64,32,.10)!important;contain:layout paint style!important;-webkit-tap-highlight-color:transparent!important}
          #pro>.nav button{position:relative!important;width:100%!important;height:64px!important;min-height:64px!important;min-width:0!important;padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;border-radius:24px!important;background:rgba(255,255,255,.14)!important;color:rgba(255,255,255,.98)!important;border:1px solid rgba(255,255,255,.18)!important;box-shadow:none!important;transform:translate3d(0,0,0) scale(1)!important;transition:transform .18s ease,background-color .18s ease,box-shadow .18s ease!important;will-change:auto!important;-webkit-tap-highlight-color:transparent!important}
          #pro>.nav button .nav-icon{width:29px!important;height:29px!important;pointer-events:none!important;filter:drop-shadow(0 1px 1px rgba(0,0,0,.12))!important}
          #pro>.nav button.active{background:rgba(255,255,255,.29)!important;border-color:rgba(255,255,255,.40)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.62),0 7px 16px rgba(57,38,22,.11)!important}
          #pro>.nav button.active::after{content:""!important;position:absolute!important;width:5px!important;height:5px!important;left:50%!important;bottom:5px!important;transform:translateX(-50%)!important;border-radius:50%!important;background:rgba(255,255,255,.96)!important;box-shadow:0 0 8px rgba(255,255,255,.72)!important;pointer-events:none!important}
          #pro>.nav button::before{content:""!important;position:absolute!important;inset:-40%!important;border-radius:50%!important;pointer-events:none!important;opacity:0!important;background:radial-gradient(circle at var(--touch-x,50%) var(--touch-y,50%),rgba(255,255,255,.76) 0,rgba(255,255,255,.25) 15%,rgba(255,255,255,0) 44%)!important;transform:scale(.45) translateZ(0)!important;transition:opacity .08s ease,transform .20s cubic-bezier(.18,.75,.25,1)!important}
          #pro>.nav button.liquid-touch{transform:translate3d(0,0,0) scale(.93)!important;background:rgba(255,255,255,.31)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.70),0 5px 15px rgba(57,38,22,.12)!important}
          #pro>.nav button.liquid-touch::before{opacity:1!important;transform:scale(1) translateZ(0)!important}
          .liquid-ripple{display:none!important}
          *{scrollbar-width:none}*::-webkit-scrollbar{width:0;height:0}
          @media(max-width:600px){.card{padding:19px!important;border-radius:26px!important}.card h3{font-size:26px!important}.total{font-size:31px!important}#pro>.nav{height:82px!important;border-radius:31px!important}#pro>.nav button{height:64px!important;min-height:64px!important;border-radius:24px!important}}
          @media(prefers-reduced-motion:reduce){#pro>.nav button,#pro>.nav button::before{transition:none!important}}
          </style>
          <script id="NAWAB_SMOOTH_TOUCH_FINAL">
          (function(){
            function bind(){
              var nav=document.querySelector('#pro>.nav');if(!nav||nav.dataset.smoothTouch==='1')return;
              nav.dataset.smoothTouch='1';
              [].slice.call(nav.querySelectorAll('button')).forEach(function(btn){
                btn.addEventListener('pointerdown',function(e){
                  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
                  var r=btn.getBoundingClientRect();
                  btn.style.setProperty('--touch-x',Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))+'%');
                  btn.style.setProperty('--touch-y',Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))+'%');
                  btn.classList.add('liquid-touch');
                });
                ['pointerup','pointercancel','pointerleave'].forEach(function(ev){btn.addEventListener(ev,function(){btn.classList.remove('liquid-touch')})});
              });
            }
            document.addEventListener('pointerdown',function(e){
              var b=e.target.closest&&e.target.closest('#pro>.nav button');if(b)e.stopImmediatePropagation();
            },true);
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind);else bind();
          })();
          </script>
          '''
          s = s.replace("</head>", patch + "\n</head>", 1)
          p.write_text(s, encoding="utf-8")
          PY
          fi

          if [[ -n "$JAVA" ]]; then
            python3 - "$JAVA" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text(encoding="utf-8")
          s=s.replace("}, 280));","}, 280)));")
          replacement = r'''private void requestHighRefreshRate() {
          try {
              WindowManager.LayoutParams lp = getWindow().getAttributes();
              lp.preferredRefreshRate = 120f;
              getWindow().setAttributes(lp);
          } catch (Throwable ignored) { }
          }'''
          s=re.sub(r"private void requestHighRefreshRate\(\)\s*\{.*?(?=\n\s*private\s|\Z)", replacement, s, count=1, flags=re.S)
          s=re.sub(r"\s*try\s*\{\s*getWindow\(\)\.setFrameRate\([^;]+;\s*\}\s*catch\s*\(Throwable ignored\)\s*\{\s*\}","",s)
          s=s.replace('.setMediaSize(android.print.PrintAttributes.MediaSize.UNKNOWN_PORTRAIT)', '.setMediaSize(new android.print.PrintAttributes.MediaSize("NAWAB_OUD_58MM", "Nawab Oud 58mm", 2283, 10000))')
          p.write_text(s,encoding="utf-8")
          PY

      - name: Find Gradle project root
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(find build-project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --no-daemon -Pkotlin.jvm.target.validation.mode=warning

      - name: Find generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK_FILE"
          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/apk-output/Nawab-Oud-Smooth-58mm.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nawab-Oud-Smooth-58mm-APK
          path: apk-output/Nawab-Oud-Smooth-58mm.apk
          if-no-files-found: error
          retention-days: 30
